name: Uptime Ghost
# Every hour: read the status feeds in statuspages.json, write verse for new incidents, post to Bluesky.
# Posts only when the BLUESKY_* secrets exist; without them the run is a dry run that prints what it would post.
# State (which incidents the ghost has already sung about) travels between runs in the Actions cache.
on:
  schedule:
    - cron: "17,47 * * * *"  # twice an hour: the status feeds (GitHub drops scheduled runs near the top of the hour under load)
    - cron: "33 14 * * 4"    # Thursday 14:33 UTC (10:33 am Montreal): Throwback Thursday, three graves
  workflow_dispatch:
    inputs:
      mode:
        description: "post: the real thing. dry-run: write the verse, post nothing. rehearse: verse and cards for each service's last incident, posted nowhere. throwback / throwback-dry-run: the Thursday graves."
        type: choice
        options: [post, dry-run, rehearse, throwback, throwback-dry-run]
        default: post

permissions:
  contents: read

concurrency:
  group: ghost
  cancel-in-progress: false

jobs:
  haunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the ghost's memory
        uses: actions/cache/restore@v4
        with:
          path: state/ghost
          key: ghost-state-${{ github.run_id }}
          restore-keys: ghost-state-

      - name: Cache Ollama and the models
        uses: actions/cache@v4
        with:
          path: |
            ~/ollama
            ~/.ollama/models
          key: ollama-gemma3-4b-embeddinggemma-v1

      - name: Install Ollama (user-local, no sudo)
        run: |
          if [ ! -x "$HOME/ollama/bin/ollama" ]; then
            mkdir -p "$HOME/ollama"
            curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | zstd -d | tar -xf - -C "$HOME/ollama"
          fi
          echo "$HOME/ollama/bin" >> "$GITHUB_PATH"

      - name: Start Ollama and pull the models
        env:
          TIGER_DATABASE_URL: ${{ secrets.TIGER_DATABASE_URL }}
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:11434/ > /dev/null && break; sleep 1; done
          # progress bars are thousands of log lines; keep the last one
          ollama pull gemma3:4b 2>&1 | tr '\r' '\n' | tail -n 1
          if [ -n "$TIGER_DATABASE_URL" ]; then ollama pull embeddinggemma 2>&1 | tr '\r' '\n' | tail -n 1; fi
          ollama list

      - name: Playwright with Chromium (the image cards)
        run: pip install -q playwright==1.64.1

      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.1

      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Optional extras (Tiger Data memory, Browserbase screenshots)
        env:
          TIGER_DATABASE_URL: ${{ secrets.TIGER_DATABASE_URL }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
        run: |
          if [ -n "$TIGER_DATABASE_URL" ]; then pip install -q "psycopg[binary]" pgvector; fi
          if [ -n "$BROWSERBASE_API_KEY" ]; then pip install -q browserbase; fi

      - name: Haunt
        env:
          MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          TIGER_DATABASE_URL: ${{ secrets.TIGER_DATABASE_URL }}
        run: |
          mkdir -p state/ghost out
          if [ "$SCHEDULE" = "33 14 * * 4" ]; then MODE=throwback; fi
          case "$MODE" in
            rehearse)          python lazywatch_ghost.py rehearse --out out ;;
            dry-run)           python lazywatch_ghost.py --dry-run --out out ;;
            throwback)         python lazywatch_ghost.py throwback --out out ;;
            throwback-dry-run) python lazywatch_ghost.py throwback --dry-run --out out ;;
            *)                 python lazywatch_ghost.py --out out ;;
          esac
          python lazywatch_ghost.py graveyard

      - name: Keep the cards (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_number }}
          path: out
          if-no-files-found: ignore
          retention-days: 14

      - name: Save the ghost's memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/ghost
          key: ghost-state-${{ github.run_id }}
